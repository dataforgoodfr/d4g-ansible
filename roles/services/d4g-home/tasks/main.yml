---
- name: Create d4g-home directory
  file:
    path: /opt/d4g-home
    state: directory

- name: Create d4g-home template files
  template:
    src: "{{ item }}.j2"
    dest: /opt/d4g-home/{{ item }}
  with_items:
    - docker-compose.yml
    - home.env

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/d4g-home
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml d4g-home
  args:
    chdir: /opt/d4g-home
  tags:
    - up
  when: is_swarm_leader | default(false)

- import_role:
    name: roles/utilities/sql-backup
  vars:
    service: d4g-home
    service_dir: /opt/d4g-home
    pgsql_host: "{{ lookup('env', 'POLETECH_DB_HOST') }}"
    pgsql_port: "{{ lookup('env', 'POLETECH_DB_PORT') }}"
    pgsql_user: community_manager
    pgsql_password: "{{ lookup('env', 'HOME_DB_PASSWORD') }}"
    pgsql_database: community_manager
  tags:
    - backup
    - service
  when: inventory_hostname == deploy_on
