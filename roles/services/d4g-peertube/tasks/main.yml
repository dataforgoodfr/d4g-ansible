---
- name: Create d4g-peertube directory
  file:
    path: "/opt/d4g-peertube"
    state: directory

- name: Create d4g-peertube data directories
  file:
    path: "/opt/d4g-peertube/{{ item }}"
    state: directory
  with_items:
    - data
    - data/storage
    - data/config
    - data/logs
    - data/redis

- name: Creating d4g-peertube templates
  template:
    src: "{{ item }}.j2"
    dest: /opt/d4g-peertube/{{ item }}
  with_items:
    - docker-compose.yml
    - peertube.env

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/d4g-peertube
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml d4g-peertube
  args:
    chdir: /opt/d4g-peertube
  tags:
    - up
  when: is_swarm_leader | default(false)
