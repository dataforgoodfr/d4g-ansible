# Configuration Apache propre au site de la Convention Citoyenne.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    # Pas de listing des dossiers (notamment /actus/data/).
    Options -Indexes
</Directory>

# Les fichiers de données des actualités ne sont servis qu'à travers PHP.
<FilesMatch "\.json$">
    Require all denied
</FilesMatch>
