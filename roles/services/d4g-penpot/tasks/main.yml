---
- name: Create d4g-penpot directory
  file:
    path: "/opt/d4g-penpot"
    state: directory

- name: Creating d4g-penpot template
  template:
    src: "{{ item }}.j2"
    dest: /opt/d4g-penpot/{{ item }}
  with_items:
    - docker-compose.yml
    - penpot.env

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/d4g-penpot
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml d4g-penpot
  args:
    chdir: /opt/d4g-penpot
  tags:
    - up
  when: is_swarm_leader | default(false)

- import_role:
    name: roles/utilities/sql-backup
  vars:
    service: d4g-penpot
    service_dir: /opt/d4g-penpot
    pgsql_host: "{{ lookup('env', 'POLETECH_DB_HOST') }}"
    pgsql_port: "{{ lookup('env', 'POLETECH_DB_PORT') }}"
    pgsql_user: penpot
    pgsql_password: "{{ lookup('env', 'PENPOT_DATABASE_PASSWORD') }}"
    pgsql_database: penpot
  tags:
    - backup
    - service
  when: inventory_hostname == deploy_on
