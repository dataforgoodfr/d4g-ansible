---
- name: Create collectif5050-metabase directory
  file:
    path: /opt/collectif5050-metabase
    state: directory

- name: Create collectif5050-metabase files
  template:
    src: "{{ item }}.j2"
    dest: /opt/collectif5050-metabase/{{ item }}
  with_items:
    - docker-compose.yml
    - collectif5050-metabase.env

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/collectif5050-metabase
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml collectif5050-metabase
  args:
    chdir: /opt/collectif5050-metabase
  tags:
    - up
  when: is_swarm_leader | default(false)

- import_role:
    name: roles/utilities/sql-backup
  vars:
    service: collectif5050-metabase
    service_dir: /opt/collectif5050-metabase
    pgsql_host: "{{ lookup('env', 'POLETECH_DB_HOST') }}"
    pgsql_port: "{{ lookup('env', 'POLETECH_DB_PORT') }}"
    pgsql_user: ric_metabase
    pgsql_password: "{{ lookup('env', 'SECONDEMAIN_METABASE_DB_PASSWORD') }}"
    pgsql_database: reveler_inegalites_cinema
  tags:
    - backup
    - service
  when: inventory_hostname == deploy_on
