---
- name: Create democis directory
  file:
    path: /opt/democis
    state: directory

# Les actualités créées depuis le back-office sont écrites par Apache (www-data,
# uid 33 dans l'image php:apache) : le dossier doit lui appartenir.
- name: Create democis news data directory
  file:
    path: "/opt/democis/actus/data"
    state: directory
    owner: "33"
    group: "33"
    mode: "0755"

- name: Create democis files
  template:
    src: "{{ item }}.j2"
    dest: /opt/democis/{{ item }}
  with_items:
    - docker-compose.yml
    - democis.env

- name: Copy democis server configuration
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/democis/{{ item }}"
  loop:
    - apache-democis.conf
    - php-democis.ini

- name: Copy democis site
  ansible.builtin.copy:
    src: site/
    dest: /opt/democis/site/

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/democis
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml democis
  args:
    chdir: /opt/democis
  tags:
    - up
  when: is_swarm_leader | default(false)
