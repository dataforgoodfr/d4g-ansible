---
- name: Create us-climate-data-metabase directory
  file:
    path: /opt/us-climate-data-metabase
    state: directory

- name: Create us-climate-data-metabase files
  template:
    src: "{{ item }}.j2"
    dest: /opt/us-climate-data-metabase/{{ item }}
  with_items:
    - docker-compose.yml
    - us-climate-data-metabase.env

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/us-climate-data-metabase
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml us-climate-data-metabase
  args:
    chdir: /opt/us-climate-data-metabase
  tags:
    - up
  when: is_swarm_leader | default(false)

- import_role:
    name: roles/utilities/sql-backup
  vars:
    service: us-climate-data-metabase
    service_dir: /opt/us-climate-data-metabase
    pgsql_host: "{{ lookup('env', 'POLETECH_DB_HOST') }}"
    pgsql_port: "{{ lookup('env', 'POLETECH_DB_PORT') }}"
    pgsql_user: us_climate_data
    pgsql_password: "{{ lookup('env', 'US_CLIMATE_DATA_DB_PASSWORD') }}"
    pgsql_database: us_climate_data
  tags:
    - backup
    - service
  when: inventory_hostname == deploy_on
