---
- name: Create d4g-metabase directory
  file:
    path: /opt/d4g-metabase
    state: directory

- name: Create d4g-metabase files
  template:
    src: "{{ item }}.j2"
    dest: /opt/d4g-metabase/{{ item }}
  with_items:
    - docker-compose.yml
    - d4g-metabase.env

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/d4g-metabase
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml d4g-metabase
  args:
    chdir: /opt/d4g-metabase
  tags:
    - up
  when: is_swarm_leader | default(false)

- import_role:
    name: roles/utilities/sql-backup
  vars:
    service: d4g-metabase
    service_dir: /opt/d4g-metabase
    pgsql_host: "{{ lookup('env', 'POLETECH_DB_HOST') }}"
    pgsql_port: "{{ lookup('env', 'POLETECH_DB_PORT') }}"
    pgsql_user: d4g_metabase
    pgsql_password: "{{ lookup('env', 'D4G_METABASE_DB_PASSWORD') }}"
    pgsql_database: d4g_metabase
  tags:
    - backup
    - service
  when: inventory_hostname == deploy_on
