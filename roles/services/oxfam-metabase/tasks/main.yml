---
- name: Create oxfam-metabase directory
  file:
    path: /opt/oxfam-metabase
    state: directory

- name: Create oxfam-metabase files
  template:
    src: "{{ item }}.j2"
    dest: /opt/oxfam-metabase/{{ item }}
  with_items:
    - docker-compose.yml
    - oxfam-metabase.env

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/oxfam-metabase
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml oxfam-metabase
  args:
    chdir: /opt/oxfam-metabase
  tags:
    - up
  when: is_swarm_leader | default(false)

- import_role:
    name: roles/utilities/sql-backup
  vars:
    service: oxfam-metabase
    service_dir: /opt/oxfam-metabase
    pgsql_host: "{{ lookup('env', 'POLETECH_DB_HOST') }}"
    pgsql_port: "{{ lookup('env', 'POLETECH_DB_PORT') }}"
    pgsql_user: oxfam
    pgsql_password: "{{ lookup('env', 'METABASE_OXFAM_DB_PASSWORD') }}"
    pgsql_database: metabase_oxfam
  tags:
    - backup
    - service
  when: inventory_hostname == deploy_on
