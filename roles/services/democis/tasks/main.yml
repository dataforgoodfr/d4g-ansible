---
- name: Create democis directory
  file:
    path: /opt/democis
    state: directory

# Les actualités et les articles « On en parle » gérés depuis le back-office
# sont écrits par Apache (www-data, uid 33 dans l'image php:apache) : les
# dossiers doivent lui appartenir.
- name: Create democis back-office data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "33"
    group: "33"
    mode: "0755"
  loop:
    - /opt/democis/actus/data
    - /opt/democis/actus/presse

- name: Create democis files
  template:
    src: "{{ item }}.j2"
    dest: /opt/democis/{{ item }}
  with_items:
    - docker-compose.yml
    - democis.env

- name: Copy democis server configuration
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/democis/{{ item }}"
  loop:
    - apache-democis.conf
    - php-democis.ini

- name: Copy democis site
  ansible.builtin.copy:
    src: site/
    dest: /opt/democis/site/

- name: Pull
  command: docker compose pull
  args:
    chdir: /opt/democis
  tags:
    - pull
  when: inventory_hostname == deploy_on

- name: Up
  command: docker stack deploy -c docker-compose.yml democis
  args:
    chdir: /opt/democis
  tags:
    - up
  when: is_swarm_leader | default(false)
